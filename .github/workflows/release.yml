name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.0.0). Leave empty to use the latest tag.'
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-release:
    name: build-docker-and-package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Install web deps
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Package release artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_NAME="outlook-graph-mail-v${VERSION}"
          PKG_DIR="release/${PKG_NAME}"
          mkdir -p "${PKG_DIR}/server" "${PKG_DIR}/public" dist-artifacts

          cp -r server/dist "${PKG_DIR}/server/"
          cp -r server/prisma "${PKG_DIR}/server/"
          cp server/package.json "${PKG_DIR}/server/"
          cp server/package-lock.json "${PKG_DIR}/server/"
          cp server/.env.example "${PKG_DIR}/server/" 2>/dev/null || true

          cp -r web/dist/. "${PKG_DIR}/public/"
          cp Dockerfile docker-compose.yml docker-compose.build.yml README.md .env.example "${PKG_DIR}/"
          cp scripts/start.sh "${PKG_DIR}/start.sh"
          cp scripts/start.bat "${PKG_DIR}/start.bat"
          chmod +x "${PKG_DIR}/start.sh"

          tar -czf "dist-artifacts/${PKG_NAME}.tar.gz" -C release "${PKG_NAME}"
          (cd release && zip -qr "../dist-artifacts/${PKG_NAME}.zip" "${PKG_NAME}")
          ls -lh dist-artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.tag }}
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist-artifacts/outlook-graph-mail-v${{ steps.version.outputs.version }}.tar.gz
            dist-artifacts/outlook-graph-mail-v${{ steps.version.outputs.version }}.zip
          body: |
            ## Docker

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}:latest
            ```

            Run with compose (port **8898**):

            ```bash
            export JWT_SECRET="replace-with-at-least-32-char-random-secret"
            export ENCRYPTION_KEY="replace-with-32-character-secret-key"
            export ADMIN_PASSWORD="replace-with-strong-password"
            docker compose up -d
            ```

            ## Offline package

            Download the attached `tar.gz` / `zip`, extract, configure `server/.env`, then run `./start.sh` or `start.bat`.

            Default listen port: **8898**
